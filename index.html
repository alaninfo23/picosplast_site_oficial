<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Picos Plast — Distribuidora de embalagens descartáveis e materiais plásticos. Atendemos todo o Piauí com logística própria e entrega rápida."
    />
    <title>Picos Plast | Embalagens e Descartáveis — Picos, PI</title>
    <link rel="stylesheet" href="assets/css/style.css" />
    <script
      src="https://unpkg.com/@phosphor-icons/web@2.1.1/src/index.js"
      defer
    ></script>
  </head>
  <body>
    <!-- ===== NAVBAR ===== -->
    <nav class="navbar" id="navbar">
      <div class="nav-container">
        <div class="wa-float-wrap" id="waFloat">
  <div class="wa-float-menu" id="waMenu" hidden>
    <a href="https://api.whatsapp.com/send/?phone=5589999836120&text&type=phone_number&app_absent=0" target="_blank" rel="noopener" class="wa-float-option">
      <i class="ph-fill ph-whatsapp-logo"></i> Centro
    </a>
    <a href="https://api.whatsapp.com/send/?phone=558994680892&text&type=phone_number&app_absent=0" target="_blank" rel="noopener" class="wa-float-option">
      <i class="ph-fill ph-whatsapp-logo"></i> BR
    </a>
    <a href="https://api.whatsapp.com/send/?phone=5511998490742&text&type=phone_number&app_absent=0" target="_blank" rel="noopener" class="wa-float-option">
      <i class="ph-fill ph-whatsapp-logo"></i> Utilidades
    </a>
  </div>
  <button class="wa-float" id="waBtn" aria-label="WhatsApp" aria-expanded="false">
    <i class="ph-fill ph-whatsapp-logo"></i>
  </button>
</div>

    <script>
      (function () {
        'use strict';

        /* ---- Navbar scroll ---- */
        const navbar = document.getElementById('navbar');
        window.addEventListener(
          'scroll',
          () => {
            navbar.classList.toggle('scrolled', window.scrollY > 60);
          },
          { passive: true },
        );

        /* ---- Mobile menu ---- */
        document.getElementById('navToggle').addEventListener('click', () => {
          document.getElementById('navLinks').classList.toggle('open');
        });

        /* ---- Scroll reveal ---- */
        const revealObserver = new IntersectionObserver(
          (entries) => {
            entries.forEach((e) => {
              if (e.isIntersecting) {
                e.target.classList.add('visible');
                revealObserver.unobserve(e.target);
              }
            });
          },
          { threshold: 0.1, rootMargin: '0px 0px -40px 0px' },
        );

        document
          .querySelectorAll('.reveal, .animate-up')
          .forEach((el) => revealObserver.observe(el));

        /* ---- Parallax leve no hero ---- */
        const hero = document.getElementById('hero');
        const heroBg = hero.querySelector('.hero-bg');
        window.addEventListener(
          'scroll',
          () => {
            if (window.scrollY < window.innerHeight) {
              heroBg.style.transform =
                'translateY(' + window.scrollY * 0.25 + 'px)';
            }
          },
          { passive: true },
        );

        /* ---- Magnetic hover nos botões ---- */
        document
          .querySelectorAll('.btn-primary, .btn-blue, .btn-whatsapp')
          .forEach((btn) => {
            btn.addEventListener('mousemove', (e) => {
              const rect = btn.getBoundingClientRect();
              const x = e.clientX - rect.left - rect.width / 2;
              const y = e.clientY - rect.top - rect.height / 2;
              btn.style.transform = `translateY(-2px) translate(${x * 0.06}px, ${y * 0.06}px)`;
            });
            btn.addEventListener('mouseleave', () => {
              btn.style.transform = '';
            });
          });

        /* ---- Contador animado nos stats do hero ---- */
        const counters = document.querySelectorAll('.counter');
        const counterObserver = new IntersectionObserver((entries) => {
          entries.forEach(e => {
            if (!e.isIntersecting) return;
            const el = e.target;
            const target = +el.dataset.target;
            const duration = 1800;
            const step = target / (duration / 16);
            let current = 0;
            const timer = setInterval(() => {
              current += step;
              if (current >= target) { el.textContent = target; clearInterval(timer); }
              else el.textContent = Math.floor(current);
            }, 16);
            counterObserver.unobserve(el);
          });
        }, { threshold: 0.5 });
        counters.forEach(c => counterObserver.observe(c));

        /* ---- Brands carousel ---- */
        const track = document.getElementById('brandsTrack');
        const viewport = document.getElementById('brandsViewport');
        let pos = 0,
          paused = false;
        function half() {
          return track.scrollWidth / 2;
        }
        function step() {
          if (!paused) {
            pos += 1;
            if (pos >= half()) pos = 0;
            track.style.transform = 'translateX(-' + pos + 'px)';
          }
          requestAnimationFrame(step);
        }
        requestAnimationFrame(step);
        function skip(dir) {
          paused = true;
          pos += dir * 194;
          if (pos < 0) pos = half() + pos;
          if (pos >= half()) pos -= half();
          track.style.transform = 'translateX(-' + pos + 'px)';
          setTimeout(() => {
            paused = false;
          }, 500);
        }
        document
          .getElementById('brandsNext')
          .addEventListener('click', () => skip(1));
        document
          .getElementById('brandsPrev')
          .addEventListener('click', () => skip(-1));
        viewport.addEventListener('mouseenter', () => {
          paused = true;
        });
        viewport.addEventListener('mouseleave', () => {
          paused = false;
        });

        /* ---- Cursor glow (desktop only) ---- */
        if (
          window.innerWidth > 768 &&
          !window.matchMedia('(prefers-reduced-motion: reduce)').matches
        ) {
          const glow = document.createElement('div');
          glow.style.cssText =
            'position:fixed;width:500px;height:500px;border-radius:50%;pointer-events:none;z-index:0;background:radial-gradient(circle,rgba(37,99,235,.06) 0%,transparent 70%);transform:translate(-50%,-50%);transition:left .8s ease,top .8s ease;left:-50%;top:-50%';
          document.body.appendChild(glow);
          document.addEventListener(
            'mousemove',
            (e) => {
              glow.style.left = e.clientX + 'px';
              glow.style.top = e.clientY + 'px';
            },
            { passive: true },
          );
        }
      })();
    </script>
  
<script>
  /* Dropdown catálogos */
  document.querySelectorAll('.nav-dropdown-toggle').forEach(function(btn) {
    btn.addEventListener('click', function(e) {
      e.stopPropagation();
      var li = btn.closest('.nav-dropdown');
      var open = li.classList.toggle('open');
      btn.setAttribute('aria-expanded', open);
    });
  });
  document.addEventListener('click', function() {
    document.querySelectorAll('.nav-dropdown.open').forEach(function(li) {
      li.classList.remove('open');
      li.querySelector('.nav-dropdown-toggle').setAttribute('aria-expanded', 'false');
    });
  });
</script>
<script>
  /* WhatsApp float menu */
  var waBtn = document.getElementById('waBtn');
  var waMenu = document.getElementById('waMenu');
  if (waBtn) {
    waBtn.addEventListener('click', function(e) {
      e.stopPropagation();
      var open = waMenu.hasAttribute('hidden');
      open ? waMenu.removeAttribute('hidden') : waMenu.setAttribute('hidden', '');
      waBtn.setAttribute('aria-expanded', open);
    });
    document.addEventListener('click', function() {
      waMenu.setAttribute('hidden', '');
      waBtn.setAttribute('aria-expanded', 'false');
    });
  }
</script>
</body>
</html>
