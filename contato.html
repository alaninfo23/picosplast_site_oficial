<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Entre em contato com a Picos Plast. WhatsApp, telefone, e-mail e endereços em Picos - PI. Atendemos todo o Piauí." />
  <title>Contato | Picos Plast — Fale Conosco</title>
  <link rel="stylesheet" href="assets/css/style.css" />
  <script src="https://unpkg.com/@phosphor-icons/web@2.1.1/src/index.js" defer></script>
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar" id="navbar">
  <div class="nav-container">
    <div class="wa-float-wrap" id="waFloat">
  <div class="wa-float-menu" id="waMenu" hidden>
    <a href="https://api.whatsapp.com/send/?phone=5589999836120&text&type=phone_number&app_absent=0" target="_blank" rel="noopener" class="wa-float-option">
      <i class="ph-fill ph-whatsapp-logo"></i> Centro
    </a>
    <a href="https://api.whatsapp.com/send/?phone=558994680892&text&type=phone_number&app_absent=0" target="_blank" rel="noopener" class="wa-float-option">
      <i class="ph-fill ph-whatsapp-logo"></i> BR
    </a>
    <a href="https://api.whatsapp.com/send/?phone=5511998490742&text&type=phone_number&app_absent=0" target="_blank" rel="noopener" class="wa-float-option">
      <i class="ph-fill ph-whatsapp-logo"></i> Utilidades
    </a>
  </div>
  <button class="wa-float" id="waBtn" aria-label="WhatsApp" aria-expanded="false">
    <i class="ph-fill ph-whatsapp-logo"></i>
  </button>
</div>

<script>
  const navbar = document.getElementById('navbar');
  window.addEventListener('scroll', () => { navbar.classList.toggle('scrolled', window.scrollY > 40); }, { passive: true });
  document.getElementById('navToggle').addEventListener('click', () => { document.getElementById('navLinks').classList.toggle('open'); });

  /* Magnetic buttons */
  document.querySelectorAll('.btn-primary,.btn-blue,.btn-whatsapp').forEach(function(btn){
    btn.addEventListener('mousemove',function(e){var r=btn.getBoundingClientRect(),x=e.clientX-r.left-r.width/2,y=e.clientY-r.top-r.height/2;btn.style.transform='translateY(-2px) translate('+(x*.06)+'px,'+(y*.06)+'px)';});
    btn.addEventListener('mouseleave',function(){btn.style.transform='';});
  });
</script>

<script>
  /* Dropdown catálogos */
  document.querySelectorAll('.nav-dropdown-toggle').forEach(function(btn) {
    btn.addEventListener('click', function(e) {
      e.stopPropagation();
      var li = btn.closest('.nav-dropdown');
      var open = li.classList.toggle('open');
      btn.setAttribute('aria-expanded', open);
    });
  });
  document.addEventListener('click', function() {
    document.querySelectorAll('.nav-dropdown.open').forEach(function(li) {
      li.classList.remove('open');
      li.querySelector('.nav-dropdown-toggle').setAttribute('aria-expanded', 'false');
    });
  });
</script>
<script>
  /* WhatsApp float menu */
  var waBtn = document.getElementById('waBtn');
  var waMenu = document.getElementById('waMenu');
  if (waBtn) {
    waBtn.addEventListener('click', function(e) {
      e.stopPropagation();
      var open = waMenu.hasAttribute('hidden');
      open ? waMenu.removeAttribute('hidden') : waMenu.setAttribute('hidden', '');
      waBtn.setAttribute('aria-expanded', open);
    });
    document.addEventListener('click', function() {
      waMenu.setAttribute('hidden', '');
      waBtn.setAttribute('aria-expanded', 'false');
    });
  }
</script>
</body>
</html>
